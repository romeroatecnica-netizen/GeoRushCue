    <script id="georushcue-jsonld" type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "WebApplication",
            "name": "GeoRushCue",
            "url": "https://georushcue.bastelar.com/",
            "applicationCategory": "GameApplication",
            "operatingSystem": "All",
            "inLanguage": ["en", "es", "fr", "de", "pt", "ar", "hi", "ru", "zh", "ja"],

              "@type": "Offer",

            }
          },
          {
            "@type": "HowTo",
            "name": "How to Challenge a Friend in GeoRushCue by Link or WhatsApp",
            "step": [
              {
                "@type": "HowToStep",
                "name": "Select category and timer",
                "text": "Pick Countries, Capitals, Rivers, Monuments, or All Mixed and choose a 60s, 90s, or 120s time trial."
              },
              {
                "@type": "HowToStep",
                "name": "Answer using minimal progressive clues",
                "text": "Read Clue 1 first to earn maximum clue-saving points plus speed and streak bonuses, or reveal Clue 2 and Clue 3 if needed."
              },
              {
                "@type": "HowToStep",
                "name": "Send your encoded challenge link",
                "text": "Share the URL or tap Send Challenge on WhatsApp so your friend plays the exact same seeded round and tries to beat your score."
              }
            ]
          },
          {
            "@type": "FAQPage",
            "mainEntity": [
              {
                "@type": "Question",
                "name": "How do GeoRushCue link challenges work without an account or server?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Your round seed, category, timer duration, and target score are encoded directly into the shareable URL parameter so your opponent plays the exact same sequence of questions locally."
                }
              },
              {
                "@type": "Question",
                "name": "How are points calculated with progressive clues and speed?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Solving on Clue 1 awards 150 base points, Clue 2 awards 100 points, and Clue 3 awards 60 points, plus up to 40 speed bonus points and consecutive streak bonuses."
                }
              }
            ]
          }
        ]
      }
